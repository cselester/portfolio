<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Blog posts by Tushar Tripathi on programming, tech, and more." />
    <title>Blog | Tushar Tripathi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" />
    <link rel="stylesheet" href="style.css" />
    <style>
        /* ── BLOG-SPECIFIC STYLES ─────────────────────────── */
        .blog-header {
            margin-bottom: 36px;
        }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 22px;
            margin-top: 28px;
        }

        /* Post card — reuses .project surface from style.css */
        .post-card {
            background: var(--surface-strong);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            box-shadow: 0 12px 30px rgba(31, 41, 51, 0.08);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            opacity: 0;
            transform: translateY(24px);
        }

        .post-card::before {
            content: "";
            position: absolute;
            inset: 0 auto auto 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 80, 103, 0.75), transparent);
            opacity: 0.85;
        }

        .post-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 74, 98, 0.34);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.34);
        }

        .post-card.in-view {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.2, 0.9, 0.2, 1),
                border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .post-thumb {
            width: 100%;
            height: 190px;
            object-fit: cover;
            filter: saturate(0.7) contrast(1.02) brightness(0.72) sepia(0.14) hue-rotate(-18deg);
            display: block;
        }

        .post-thumb-placeholder {
            width: 100%;
            height: 190px;
            background: linear-gradient(135deg, rgba(255, 49, 77, 0.12), rgba(10, 10, 10, 0.8));
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .post-thumb-placeholder span {
            font-size: 2.5rem;
            opacity: 0.4;
        }

        .post-body {
            padding: 22px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .post-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .post-date {
            font-family: "IBM Plex Mono", monospace;
            font-size: 0.76rem;
            color: var(--muted);
        }

        .post-label {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(255, 49, 77, 0.08);
            color: #ff7a8d;
            border: 1px solid rgba(255, 49, 77, 0.16);
            font-family: "IBM Plex Mono", monospace;
            font-size: 0.72rem;
        }

        .post-title {
            font-family: "Sora", sans-serif;
            font-size: 1.08rem;
            line-height: 1.4;
            color: var(--text);
            letter-spacing: -0.01em;
        }

        .post-excerpt {
            color: var(--muted);
            font-size: 0.88rem;
            line-height: 1.65;
            flex: 1;
            /* clamp to 3 lines */
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .post-read-more {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            padding: 10px 18px;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--brand) 0%, #a90d25 100%);
            color: #fff;
            font-family: "IBM Plex Mono", monospace;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            text-decoration: none;
            border: none;
            cursor: pointer;
            align-self: flex-start;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, gap 0.2s ease;
        }

        .post-read-more:hover {
            background: linear-gradient(135deg, #ff415c 0%, #870919 100%);
            box-shadow: 0 12px 28px rgba(255, 49, 77, 0.35);
            transform: translateY(-2px);
            gap: 12px;
            color: #fff;
            text-shadow: none;
        }

        .post-read-more .arrow-icon {
            font-size: 0.85rem;
            transition: transform 0.2s ease;
        }

        .post-read-more:hover .arrow-icon {
            transform: translateX(3px);
        }

        /* ── SKELETON LOADER ─────────────────────────────── */
        .skeleton {
            background: var(--surface-strong);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            overflow: hidden;
            opacity: 0.6;
        }

        .skeleton-thumb {
            width: 100%;
            height: 190px;
            background: linear-gradient(90deg,
                    rgba(255, 255, 255, 0.03) 25%,
                    rgba(255, 49, 77, 0.06) 50%,
                    rgba(255, 255, 255, 0.03) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.6s infinite;
        }

        .skeleton-body {
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .skeleton-line {
            height: 12px;
            border-radius: 6px;
            background: linear-gradient(90deg,
                    rgba(255, 255, 255, 0.04) 25%,
                    rgba(255, 49, 77, 0.08) 50%,
                    rgba(255, 255, 255, 0.04) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.6s infinite;
        }

        .skeleton-line.w-60 {
            width: 60%;
        }

        .skeleton-line.w-80 {
            width: 80%;
        }

        .skeleton-line.w-40 {
            width: 40%;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        /* ── ERROR / EMPTY STATE ─────────────────────────── */
        .blog-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 48px 24px;
            color: var(--muted);
        }

        .blog-state .state-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .blog-state p {
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .blog-state a {
            color: #ff7a8d;
            text-decoration: none;
        }

        /* ── LOAD MORE ───────────────────────────────────── */
        .load-more-wrap {
            text-align: center;
            margin-top: 36px;
        }

        /* ── MODAL READER ────────────────────────────────── */
        .post-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            z-index: 2000;
            display: none;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 20px;
            overflow-y: auto;
        }

        .post-modal-backdrop.open {
            display: flex;
        }

        .post-modal {
            background: #0a0a0a;
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 49, 77, 0.1);
            width: 100%;
            max-width: 760px;
            padding: 40px;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 18px;
            right: 18px;
            background: rgba(255, 49, 77, 0.08);
            border: 1px solid rgba(255, 49, 77, 0.2);
            border-radius: 10px;
            color: var(--text);
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: background 0.2s;
        }

        .modal-close:hover {
            background: rgba(255, 49, 77, 0.18);
        }

        .modal-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .modal-title {
            font-family: "Sora", sans-serif;
            font-size: clamp(1.4rem, 3vw, 2rem);
            line-height: 1.2;
            letter-spacing: -0.02em;
            margin-bottom: 20px;
        }

        .modal-body {
            color: var(--muted);
            line-height: 1.8;
            font-size: 0.97rem;
        }

        /* sanitize blogger HTML output */
        .modal-body img {
            max-width: 100%;
            border-radius: var(--radius-sm);
            margin: 16px 0;
            filter: saturate(0.85) brightness(0.9);
        }

        .modal-body a {
            color: #ff7a8d;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .modal-body pre,
        .modal-body code {
            font-family: "IBM Plex Mono", monospace;
            font-size: 0.85rem;
            background: rgba(255, 49, 77, 0.06);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 2px 6px;
        }

        .modal-body pre {
            padding: 16px;
            overflow-x: auto;
            margin: 14px 0;
        }

        .modal-body pre code {
            background: none;
            border: none;
            padding: 0;
        }

        .modal-body h1,
        .modal-body h2,
        .modal-body h3,
        .modal-body h4 {
            font-family: "Sora", sans-serif;
            color: var(--text);
            margin: 24px 0 10px;
            letter-spacing: -0.02em;
        }

        .modal-body p {
            margin-bottom: 14px;
        }

        .modal-body ul,
        .modal-body ol {
            padding-left: 22px;
            margin-bottom: 14px;
        }

        .modal-body li {
            margin-bottom: 6px;
        }

        .modal-footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: flex-end;
        }

        @media (max-width: 768px) {
            .post-modal {
                padding: 28px 20px;
            }

            .blog-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .skeleton-thumb,
            .skeleton-line {
                animation: none;
            }

            .post-card {
                opacity: 1;
                transform: none;
            }
        }
    </style>
</head>

<body>
    <div class="container1">
        <!-- Hamburger -->
        <button class="menu-btn" onclick="toggleSidebar()" aria-label="Toggle navigation" aria-controls="sidebar"
            aria-expanded="false">
            <span class="material-symbols-outlined">menu</span>
        </button>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <nav aria-label="Primary">
                <ul>
                    <li><a href="index.html"><span class="material-symbols-outlined">home</span> Home</a></li>
                    <li><a href="intro.html"><span class="material-symbols-outlined">person</span> My Intro</a></li>
                    <li><a href="services.html"><span class="material-symbols-outlined">concierge</span> Services</a>
                    </li>
                    <li><a href="blog.html" class="active"><span class="material-symbols-outlined">edit_note</span>
                            Blog</a></li>
                    <li><a href="contact.html"><span class="material-symbols-outlined">contact_support</span>
                            Contact</a></li>
                </ul>
            </nav>
        </aside>

        <div id="overlay" onclick="toggleSidebar()"></div>

        <main class="main">
            <div class="section-shell in-view">
                <!-- Header -->
                <div class="blog-header">
                    <p class="eyebrow">From the desk of cselester</p>
                    <h1 class="section-title">Blog</h1>
                    <p class="section-lead">
                        Thoughts on AI, security, backend systems, and the occasional 2am debugging session.
                        Posts pulled live from
                        <a href="https://programtechlang.blogspot.com/" target="_blank" rel="noopener"
                            style="color:#ff7a8d; text-decoration:none;">programtechlang.blogspot.com</a>.
                    </p>
                </div>

                <!-- Grid populated by JS -->
                <div class="blog-grid" id="blog-grid">
                    <!-- skeleton placeholders -->
                    <div class="skeleton" aria-hidden="true">
                        <div class="skeleton-thumb"></div>
                        <div class="skeleton-body">
                            <div class="skeleton-line w-40"></div>
                            <div class="skeleton-line w-80"></div>
                            <div class="skeleton-line w-60"></div>
                        </div>
                    </div>
                    <div class="skeleton" aria-hidden="true">
                        <div class="skeleton-thumb"></div>
                        <div class="skeleton-body">
                            <div class="skeleton-line w-40"></div>
                            <div class="skeleton-line w-80"></div>
                            <div class="skeleton-line w-60"></div>
                        </div>
                    </div>
                    <div class="skeleton" aria-hidden="true">
                        <div class="skeleton-thumb"></div>
                        <div class="skeleton-body">
                            <div class="skeleton-line w-40"></div>
                            <div class="skeleton-line w-80"></div>
                            <div class="skeleton-line w-60"></div>
                        </div>
                    </div>
                </div>

                <!-- Load more -->
                <div class="load-more-wrap" id="load-more-wrap" style="display:none;">
                    <button class="btn btn-secondary" id="load-more-btn" onclick="loadMore()">
                        Load more posts
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- ── POST MODAL ────────────────────────────────────── -->
    <div class="post-modal-backdrop" id="post-modal-backdrop" role="dialog" aria-modal="true"
        aria-labelledby="modal-title-text">
        <div class="post-modal">
            <button class="modal-close" onclick="closeModal()" aria-label="Close post">
                <span class="material-symbols-outlined" style="font-size:1.1rem">close</span>
            </button>
            <div class="modal-meta" id="modal-meta"></div>
            <h2 class="modal-title" id="modal-title-text"></h2>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer">
                <a id="modal-orig-link" href="#" target="_blank" rel="noopener" class="btn btn-secondary"
                    style="font-size:0.85rem; min-height:40px; padding:0 16px;">
                    View on Blogger ↗
                </a>
            </div>
        </div>
    </div>

    <script src="scripts.js"></script>
    <script>
        // ── CONFIG ────────────────────────────────────────────
        const BLOG_URL = "https://programtechlang.blogspot.com";
        const FEED_BASE = `${BLOG_URL}/feeds/posts/default?alt=json`;
        const PAGE_SIZE = 6;

        // ── STATE ─────────────────────────────────────────────
        let allPosts = [];
        let startIndex = 1;
        let totalPosts = 0;
        let loading = false;

        // ── INIT ──────────────────────────────────────────────
        fetchPosts();

        // ── FETCH ─────────────────────────────────────────────
        async function fetchPosts() {
            if (loading) return;
            loading = true;

            const url = `${FEED_BASE}&max-results=${PAGE_SIZE}&start-index=${startIndex}&callback=handleFeed`;

            // Use JSONP — Blogger supports ?callback= which avoids CORS
            return new Promise((resolve) => {
                window.handleFeed = function (data) {
                    resolve(data);
                    delete window.handleFeed;
                };
                const s = document.createElement("script");
                s.src = url;
                s.onerror = () => {
                    showError();
                    resolve(null);
                    delete window.handleFeed;
                };
                document.head.appendChild(s);
            }).then((data) => {
                loading = false;
                if (!data) return;

                const feed = data.feed;
                totalPosts = parseInt(feed["openSearch$totalResults"]["$t"], 10);
                const items = feed.entry || [];

                allPosts = allPosts.concat(items);
                startIndex += PAGE_SIZE;

                renderPosts(items);
                updateLoadMore();
            });
        }

        // ── RENDER CARDS ──────────────────────────────────────
        function renderPosts(items) {
            const grid = document.getElementById("blog-grid");

            // Remove skeletons on first render
            grid.querySelectorAll(".skeleton").forEach(el => el.remove());

            if (items.length === 0 && allPosts.length === 0) {
                showEmpty();
                return;
            }

            items.forEach((entry, i) => {
                const card = buildCard(entry, i);
                grid.appendChild(card);

                // Stagger reveal
                setTimeout(() => {
                    card.classList.add("in-view");
                }, i * 80);
            });
        }

        function buildCard(entry, staggerIndex) {
            // Title
            const title = entry.title["$t"] || "Untitled";

            // Link to post
            const link = (entry.link || []).find(l => l.rel === "alternate")?.href || BLOG_URL;

            // Date
            const rawDate = entry.published?.["$t"] || "";
            const date = rawDate ? new Date(rawDate).toLocaleDateString("en-US", {
                year: "numeric", month: "short", day: "numeric"
            }) : "";

            // Labels/tags
            const labels = (entry.category || []).map(c => c.term).slice(0, 2);

            // Thumbnail — try media:thumbnail, then first img in content
            let thumb = null;
            if (entry["media$thumbnail"]) {
                thumb = entry["media$thumbnail"].url.replace(/\/s[0-9]+-c\//, "/s600-c/");
            } else {
                const content = entry.content?.["$t"] || entry.summary?.["$t"] || "";
                const imgMatch = content.match(/<img[^>]+src=["']([^"']+)["']/i);
                if (imgMatch) thumb = imgMatch[1];
            }

            // Excerpt
            const rawContent = entry.content?.["$t"] || entry.summary?.["$t"] || "";
            const excerpt = stripHtml(rawContent).slice(0, 160).trim() + "…";

            // Full content for modal
            const fullContent = entry.content?.["$t"] || entry.summary?.["$t"] || "<p>Read on Blogger.</p>";

            // Build card DOM
            const card = document.createElement("article");
            card.className = "post-card";
            card.setAttribute("data-title", title);
            card.setAttribute("data-date", date);
            card.setAttribute("data-labels", JSON.stringify(labels));
            card.setAttribute("data-content", fullContent);
            card.setAttribute("data-link", link);

            card.innerHTML = `
        ${thumb
                    ? `<img class="post-thumb" src="${escHtml(thumb)}" alt="${escHtml(title)}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
             <div class="post-thumb-placeholder" style="display:none"><span class="material-symbols-outlined" style="font-size:2.5rem;opacity:.4">article</span></div>`
                    : `<div class="post-thumb-placeholder"><span class="material-symbols-outlined" style="font-size:2.5rem;opacity:.4">article</span></div>`
                }
        <div class="post-body">
          <div class="post-meta">
            <span class="post-date">${date}</span>
            ${labels.map(l => `<span class="post-label">${escHtml(l)}</span>`).join("")}
          </div>
          <h2 class="post-title">${escHtml(title)}</h2>
          <p class="post-excerpt">${escHtml(excerpt)}</p>
          <button class="post-read-more" onclick="openModal(this.closest('.post-card'))">
            Read post <span class="material-symbols-outlined arrow-icon">arrow_forward</span>
          </button>
        </div>
      `;

            return card;
        }

        // ── MODAL ─────────────────────────────────────────────
        function openModal(card) {
            const title = card.getAttribute("data-title");
            const date = card.getAttribute("data-date");
            const labels = JSON.parse(card.getAttribute("data-labels") || "[]");
            const content = card.getAttribute("data-content");
            const link = card.getAttribute("data-link");

            document.getElementById("modal-meta").innerHTML = `
        <span class="post-date">${date}</span>
        ${labels.map(l => `<span class="post-label">${escHtml(l)}</span>`).join("")}
      `;
            document.getElementById("modal-title-text").textContent = title;
            document.getElementById("modal-body").innerHTML = content;
            document.getElementById("modal-orig-link").href = link;

            const backdrop = document.getElementById("post-modal-backdrop");
            backdrop.classList.add("open");
            document.body.style.overflow = "hidden";
            backdrop.scrollTop = 0;
        }

        function closeModal() {
            document.getElementById("post-modal-backdrop").classList.remove("open");
            document.body.style.overflow = "";
        }

        // Close on backdrop click
        document.getElementById("post-modal-backdrop").addEventListener("click", function (e) {
            if (e.target === this) closeModal();
        });

        // Close on Escape
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") closeModal();
        });

        // ── LOAD MORE ─────────────────────────────────────────
        function loadMore() {
            fetchPosts();
        }

        function updateLoadMore() {
            const wrap = document.getElementById("load-more-wrap");
            if (allPosts.length < totalPosts) {
                wrap.style.display = "block";
            } else {
                wrap.style.display = "none";
            }
        }

        // ── ERROR / EMPTY STATES ──────────────────────────────
        function showError() {
            const grid = document.getElementById("blog-grid");
            grid.querySelectorAll(".skeleton").forEach(el => el.remove());
            grid.innerHTML = `
        <div class="blog-state">
          <div class="state-icon">📡</div>
          <p>Couldn't fetch posts right now.<br/>
          <a href="${BLOG_URL}" target="_blank" rel="noopener">Read directly on Blogger ↗</a></p>
        </div>`;
        }

        function showEmpty() {
            const grid = document.getElementById("blog-grid");
            grid.innerHTML = `
        <div class="blog-state">
          <div class="state-icon">✍️</div>
          <p>No posts yet — check back soon!<br/>
          <a href="${BLOG_URL}" target="_blank" rel="noopener">Visit the blog ↗</a></p>
        </div>`;
        }

        // ── UTILS ─────────────────────────────────────────────
        function stripHtml(html) {
            const d = document.createElement("div");
            d.innerHTML = html;
            return d.textContent || d.innerText || "";
        }

        function escHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }
    </script>
</body>
